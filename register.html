<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration | YousstenaFlix</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><nav class="navbar container"><a class="navbar-brand brand" href="index.html">YOUSSTENA<span>FLIX</span></a></nav>
<main class="auth-wrap"><form class="auth-card" id="registerForm"><h1>Create Account</h1><p class="auth-subtitle">Create your account to get started.</p><div class="mb-3"><input class="form-control auth-input" type="text" placeholder="Full name" required></div><div class="mb-3"><input class="form-control auth-input" type="email" placeholder="Email address" required></div><div class="mb-3"><input class="form-control auth-input" type="password" placeholder="Password (at least 6 characters)" minlength="6" required></div><div class="mb-3"><input class="form-control auth-input" type="password" placeholder="Confirm password" minlength="6" required></div><button class="btn btn-netflix w-100 auth-submit">Register</button><p class="auth-muted">Already have an account? <a href="login.html">Sign in</a>.</p><small>This page is a student front-end project. No account information is sent or stored.</small></form></main>
<script src="js/main.js"></script></body></html>
